<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories — SONIVIVA Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header"><h2>SONI<span>VIVA</span></h2><small>Admin Dashboard</small></div>
    <nav class="sidebar-nav">
      <a href="./"><span class="icon">📊</span> Dashboard</a>
      <a href="products.html"><span class="icon">📦</span> Products</a>
      <a href="categories.html" class="active"><span class="icon">📂</span> Categories</a>
      <a href="orders.html"><span class="icon">🛒</span> Orders</a>
      <a href="users.html"><span class="icon">👥</span> Users</a>
      <div class="divider"></div>
      <a href="/"><span class="icon">🏪</span> Back to Store</a>
    </nav>
    <div class="sidebar-footer"><a href="#" onclick="logout()">🚪 Logout</a></div>
  </aside>
  <main class="main-content">
    <div class="top-bar"><h1>Categories</h1><div class="top-bar-actions">
      <div class="notif-wrapper" id="notif-wrapper">
        <button class="btn-notif" id="notif-btn" onclick="toggleNotifDropdown(event)" title="Notifications" aria-label="Notifications">
          <span class="notif-icon">🔔</span>
          <span class="notif-badge" id="notif-badge" style="display:none;">0</span>
        </button>
        <div class="notif-dropdown" id="notif-dropdown">
          <div class="notif-header">
            <h4>Notifications</h4>
            <button class="notif-mark-all" onclick="markAllNotificationsRead(event)">Mark all read</button>
          </div>
          <div class="notif-list" id="notif-list">
            <div class="notif-empty">Loading...</div>
          </div>
          <div class="notif-footer">
            <a href="orders.html">View All Orders →</a>
          </div>
        </div>
      </div>
      <span class="admin-name" id="admin-name"></span><button class="btn-logout" onclick="logout()">Logout</button></div></div>
    <div class="content">
      <div style="margin-bottom:20px;"><button class="btn btn-primary" onclick="openAddCategory()">+ Add Category</button></div>
      <div class="categories-grid" id="categories-grid"><div class="loading">Loading...</div></div>
    </div>
  </main>

  <div class="modal-overlay" id="category-modal">
    <div class="modal">
      <h3 id="cat-modal-title">Add Category</h3>
      <form id="cat-form" onsubmit="saveCategory(event)">
        <input type="hidden" id="edit-cat-id">
        <div class="form-group"><label>Name *</label><input type="text" id="cat-name" required></div>
        <div class="form-group"><label>Emoji</label><input type="text" id="cat-emoji" placeholder="e.g. 🌾"></div>
        <div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeModal('category-modal')">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
      </form>
    </div>
  </div>
  <script src="js/admin.js"></script>
  <script>loadCategories();</script>
</body>
</html>
