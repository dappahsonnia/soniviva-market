<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Manage Products — SONIVIVA Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header"><h2>SONI<span>VIVA</span></h2><small>Admin Dashboard</small></div>
    <nav class="sidebar-nav">
      <a href="./"><span class="icon">📊</span> Dashboard</a>
      <a href="products.html" class="active"><span class="icon">📦</span> Products</a>
      <a href="categories.html"><span class="icon">📂</span> Categories</a>
      <a href="orders.html"><span class="icon">🛒</span> Orders</a>
      <a href="users.html"><span class="icon">👥</span> Users</a>
      <div class="divider"></div>
      <a href="/"><span class="icon">🏪</span> Back to Store</a>
    </nav>
    <div class="sidebar-footer"><a href="#" onclick="logout()">🚪 Logout</a></div>
  </aside>
  <main class="main-content">
    <div class="top-bar"><h1>Products</h1><div class="top-bar-actions"><span class="admin-name" id="admin-name"></span><button class="btn-logout" onclick="logout()">Logout</button></div></div>
    <div class="content">
      <div class="table-card">
        <div class="table-header">
          <h3>All Products</h3>
          <div class="table-actions">
            <input type="text" class="search-input" id="search-products" placeholder="Search products..." oninput="searchProducts()">
            <select class="filter-select" id="filter-category" onchange="searchProducts()"><option value="">All Categories</option></select>
            <button class="btn btn-primary" onclick="openAddProduct()">+ Add Product</button>
          </div>
        </div>
        <table><thead><tr><th>ID</th><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>★</th><th>Actions</th></tr></thead><tbody id="products-body"><tr><td colspan="8" class="loading">Loading...</td></tr></tbody></table>
      </div>
    </div>
  </main>

  <!-- Product Modal -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal">
      <h3 id="modal-title">Add Product</h3>
      <form id="product-form" onsubmit="saveProduct(event)">
        <input type="hidden" id="edit-product-id">
        <div class="form-group"><label>Name *</label><input type="text" id="prod-name" required></div>
        <div class="form-row">
          <div class="form-group"><label>Price (GH₵) *</label><input type="number" id="prod-price" step="0.01" required></div>
          <div class="form-group"><label>Stock</label><input type="number" id="prod-stock" value="100"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Category</label><select id="prod-category"><option value="">Select</option></select></div>
          <div class="form-group"><label>Unit</label><input type="text" id="prod-unit" placeholder="e.g. 1kg bag"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Vendor</label><input type="text" id="prod-vendor" value="soniviva"></div>
          <div class="form-group"><label>Emoji</label><input type="text" id="prod-emoji" placeholder="e.g. 🍚"></div>
        </div>
        <div class="form-group"><label>Image URL</label><input type="url" id="prod-image" placeholder="https://..."></div>
        <div class="form-group"><label>Description</label><textarea id="prod-description"></textarea></div>
        <div class="form-check"><input type="checkbox" id="prod-featured"><label for="prod-featured">Featured Product</label></div>
        <div class="modal-actions"><button type="button" class="btn btn-outline" onclick="closeModal('product-modal')">Cancel</button><button type="submit" class="btn btn-primary">Save Product</button></div>
      </form>
    </div>
  </div>
  <script src="js/admin.js"></script>
  <script>loadProducts();</script>
</body>
</html>
